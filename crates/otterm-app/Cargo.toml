[package]
name = "otterm-app"
description = "The otterm desktop app (Tauri)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "otterm"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
arboard = { version = "3.6", default-features = false }
fontdb.workspace = true
otterm-config.workspace = true
getrandom.workspace = true
otterm-session.workspace = true
otterm-text.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri.workspace = true
tungstenite.workspace = true

[features]
default = ["custom-protocol"]
# Serve the bundled frontend instead of the dev server. The Tauri CLI turns this off for `tauri dev`.
custom-protocol = ["tauri/custom-protocol"]
# IPC benchmarks (tests/bench/README.md). Off in normal builds.
bench = []

[lints]
workspace = true
