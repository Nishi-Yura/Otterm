[package]
name = "otterm-app"
description = "The otterm desktop app (Tauri)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "otterm"
path = "src/main.rs"

[build-dependencies]
tauri-build.workspace = true

[dependencies]
arboard = { version = "3.6", default-features = false }
fontdb.workspace = true
otterm-config.workspace = true
otterm-modhost.workspace = true
getrandom.workspace = true
# One otterm per user: later launches hand their arguments over (decision K6).
interprocess = "2"
semver.workspace = true
regex.workspace = true
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
rusqlite = { version = "0.40", features = ["bundled"] }
trash = "5"
# `otterm config export|import` (docs/06 §3).
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
toml.workspace = true
toml_edit.workspace = true
otterm-session.workspace = true
otterm-text.workspace = true
serde.workspace = true
serde_json.workspace = true
schemars.workspace = true
# A transparent window (appearance.window.opacity, docs/04 §2.1) needs the private API on macOS.
tauri = { workspace = true, features = ["macos-private-api"] }
# Signed updates from GitHub Releases (decision C10).
tauri-plugin-updater = "2"
tungstenite.workspace = true

# API keys for AI providers live in the OS keychain, never in config.toml (docs/10 §5).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[features]
default = ["custom-protocol"]
# Serve the bundled frontend instead of the dev server. The Tauri CLI turns this off for `tauri dev`.
custom-protocol = ["tauri/custom-protocol"]
# IPC benchmarks (tests/bench/README.md). Off in normal builds.
bench = []

[lints]
workspace = true
