[package]
name = "otterm-pty"
description = "PTY spawning for otterm (ConPTY on Windows, openpty elsewhere)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
anyhow.workspace = true
portable-pty.workspace = true

# Same version as portable-pty's, to read its termios (the echo flag, decision K2).
[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", default-features = false, features = ["term"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[lints]
workspace = true
