[mod]
id = "otterm.completion"
name = "Completion"
version = "1.0.0"
description = "カーソル位置の語について、辞書をもとにサブコマンド、オプション、ファイル名を補完します。 / Completes subcommands, options and file names for the word under the cursor, using the command dictionary."
author = "otterm"
license = "Apache-2.0"
kind = "extension"

[compat]
otterm = ">=0.0.0"
api = "1"
platforms = ["windows", "macos", "linux"]

[entry]
main = "dist/main.js"

# The input line is read for the word under the cursor; the working folder is listed for file names.
[permissions]
terminal.read = true
fs.read = ["${cwd}/**"]

[dependencies]
"otterm.dictionary-core" = ">=1.0.0"
