[mod]
id = "otterm.ai-assist"
name = "AI に質問 / Ask an AI"
version = "1.0.0"
description = "設定した AI に、自然文からのコマンド作成、失敗の原因、出力についての質問を聞きます。初期設定はオフで、ユーザーが操作するまで何も実行しません。 / Asks the AI you configured to write a command from plain text, explain a failure, or answer a question about output. Off by default; nothing runs until you act."
author = "otterm"
license = "Apache-2.0"
kind = "extension"

[compat]
otterm = ">=0.0.0"
api = "1"
platforms = ["windows", "macos", "linux"]

[entry]
main = "dist/main.js"

# Every request goes through the provider the user chose; the host shows the preview and redacts secrets.
# Reads blocks (command, exit code, cwd) and the selection. Never writes to the PTY: insert only.
[permissions]
ai = true
terminal.read = true
events = ["block-end", "before-execute"]

[[adds]]
command = "ai.ask"
label = "AI に聞く / Ask an AI"

[[adds]]
command = "ai.fix"
label = "直前のコマンドを直す / Fix the last command"

[[adds]]
command = "ai.summary"
label = "今なにしてた？ / What was I doing?"

[[adds]]
panel = "ai-assist.answer"
label = "AI の回答 / The AI's answer"

[dependencies]
"otterm.dictionary-core" = ">=1.0.0"
