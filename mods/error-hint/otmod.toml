[mod]
id = "otterm.error-hint"
name = "Error Hints"
version = "1.0.0"
description = "よくあるコマンドのエラーの原因を説明し、直し方のコマンドを入力欄に入れます。実行はしません。 / Explains the cause of common command errors and inserts a fix at the prompt. It never runs it."
author = "otterm"
license = "Apache-2.0"
kind = "extension"

[compat]
otterm = ">=0.0.0"
api = "1"
platforms = ["windows", "macos", "linux"]

[entry]
main = "dist/main.js"

# Reads the finished block and its output. `where` / `which` only check which package managers are installed.
[permissions]
terminal.read = true
events = ["block-end"]
process = ["where", "which"]

[dependencies]
"otterm.dictionary-core" = ">=1.0.0"
