[mod]
id = "otterm.cmd-explain"
name = "Command Explanations"
version = "1.0.0"
description = "入力欄のコマンドについて、何をするか、各オプションの意味、危険な部分を説明します。 / Explains the command on the input line: what it does, what each option means, and which parts are dangerous."
author = "otterm"
license = "Apache-2.0"
kind = "extension"

[compat]
otterm = ">=0.0.0"
api = "1"
platforms = ["windows", "macos", "linux"]

[entry]
main = "dist/main.js"

[[adds]]
command = "explain.toggle"
label = "説明バーを隠す / 表示"

# Only the input line is read, through the explain provider. Nothing is written or run.
[permissions]
terminal.read = true

[dependencies]
"otterm.dictionary-core" = ">=1.0.0"
