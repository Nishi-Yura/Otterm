[mod]
id = "nishi-yura.dict-db-tools"
name = "データベースクライアントの辞書 / Database clients dictionary"
version = "1.0.1"
description = "psql、mysql、sqlite3、redis-cli、mongosh、pg_dump、mysqldump の説明と補完を追加します。DROP、TRUNCATE、FLUSHALL、dropDatabase() を含む呼び出しは、実行前に確認します。 / Adds explanations and completion for psql, mysql, sqlite3, redis-cli, mongosh, pg_dump and mysqldump. Asks before a call that contains DROP, TRUNCATE, FLUSHALL or dropDatabase()."
author = "nishi-yura"
license = "MIT"
homepage = "https://github.com/Nishi-Yura/Otterm/tree/main/community-mods/dict-db-tools"
kind = "dictionary"

[compat]
otterm = ">=0.0.0 <2.0.0"
api = "1"
