version = "1.0.1"
description = "vite、eslint、prettier、jest、vitest、tsx、turbo の説明と補完を追加します。jest と vitest の -u（スナップショットの上書き）には注意を出します。 / Adds explanations and completion for vite, eslint, prettier, jest, vitest, tsx and turbo. Warns about -u, which overwrites snapshots, in jest and vitest."
