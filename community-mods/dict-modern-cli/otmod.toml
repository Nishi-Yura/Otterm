[mod]
id = "nishi-yura.dict-modern-cli"
name = "モダン CLI ツールの辞書 / Modern CLI tools dictionary"
version = "1.0.1"
description = "rg、fd、bat、fzf、eza、zoxide、tldr、hyperfine の説明と補完を追加します。どれもファイルを消さないので、危険の印はありません。 / Adds explanations and completion for rg, fd, bat, fzf, eza, zoxide, tldr and hyperfine. None of them deletes files, so nothing is marked as dangerous."
author = "nishi-yura"
license = "MIT"
homepage = "https://github.com/Nishi-Yura/Otterm/tree/main/community-mods/dict-modern-cli"
kind = "dictionary"

[compat]
otterm = ">=0.0.0 <2.0.0"
api = "1"
