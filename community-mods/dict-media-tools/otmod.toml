[mod]
id = "nishi-yura.dict-media-tools"
name = "メディア変換ツールの辞書 / Media tools dictionary"
version = "1.0.1"
description = "ffmpeg、ffprobe、magick、7z、pandoc、yt-dlp の説明と補完を追加します。ffmpeg と 7z の -y（上書き）には注意を出し、magick mogrify は元のファイルを書き換えるので確認します。 / Adds explanations and completion for ffmpeg, ffprobe, magick, 7z, pandoc and yt-dlp. Warns about -y (overwrite) in ffmpeg and 7z, and asks before magick mogrify, which rewrites the original files."
author = "nishi-yura"
license = "MIT"
homepage = "https://github.com/Nishi-Yura/Otterm/tree/main/community-mods/dict-media-tools"
kind = "dictionary"

[compat]
otterm = ">=0.0.0 <2.0.0"
api = "1"
