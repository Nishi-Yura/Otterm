[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/Nishi-Yura/Otterm"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
schemars = "1"
toml = "0.9"
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
