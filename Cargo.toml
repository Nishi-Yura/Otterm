[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "1.1.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/Nishi-Yura/Otterm"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
schemars = "1"
toml = "0.9"
serde_json = "1"
anyhow = "1"
portable-pty = "0.9"
tauri = "2"
tauri-build = "2"
tungstenite = "0.30"
getrandom = "0.4"
unicode-width = "0.2"
vte = "0.15"
regex = "1"
globset = "0.4"
semver = "1"
toml_edit = "0.25"
sysinfo = { version = "0.39", default-features = false, features = ["system"] }
fontdb = "0.24"
rustybuzz = "0.20"
swash = "0.2"
otterm-vt = { path = "crates/otterm-vt" }
otterm-pty = { path = "crates/otterm-pty" }
otterm-session = { path = "crates/otterm-session" }
otterm-config = { path = "crates/otterm-config" }
otterm-text = { path = "crates/otterm-text" }
otterm-modhost = { path = "crates/otterm-modhost" }

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
