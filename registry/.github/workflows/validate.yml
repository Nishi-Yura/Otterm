# For the PUBLIC otterm mod registry repository only.
# GitHub Actions is free for public repositories, so this runs on every pull request.
# If this repository is ever made private, change `on:` to `workflow_dispatch` only
# so that Actions minutes are not spent on each PR.
name: validate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/validate.mjs
