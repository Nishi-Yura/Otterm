name: Release

# Manual only, and not while the repository is private: Actions minutes on a private repository
# cost money once the free allowance is used up. On a public repository the runners are free.
# Builds the installers on all three OSes with scripts/release.mjs and keeps them as workflow
# artifacts; the release itself and the winget / Homebrew steps stay manual (docs/release.md).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: pnpm install --frozen-lockfile
      - if: runner.os == 'Windows'
        run: node scripts/fetch-conpty.js
      - run: node scripts/release.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.os }}
          path: dist-release/
