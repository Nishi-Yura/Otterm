name: Bench

# Release builds of the app take several minutes, so this runs on main and on demand rather than on every PR.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  ipc:
    name: ipc (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench
          workspaces: ". -> target/bench"

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Tauri system dependencies and a virtual display (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev xvfb

      - run: pnpm install --frozen-lockfile
      - run: node scripts/fetch-conpty.js

      # Shared runners are noisy and have no GPU: compare transports within a run, not across runs.
      - name: IPC and typing bench
        if: runner.os != 'Linux'
        run: node tests/bench/run.js --suite ipc,typing
      - name: IPC and typing bench (Xvfb)
        if: runner.os == 'Linux'
        run: xvfb-run -a node tests/bench/run.js --suite ipc,typing

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-ipc-${{ matrix.os }}
          path: tests/bench/results/latest.json
          if-no-files-found: ignore
